name: Tests

# Runs the offline test suite (fake GitHub, no secrets needed) on every push and pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt "pytest>=8,<9"
      - run: python -m pytest -q tests
